</script><script>/* Browser-local shopping prototype. No orders or payments are transmitted. */
const CART_KEY='rawlandy-cart-v1';
let cart=[];try{const stored=JSON.parse(localStorage.getItem(CART_KEY)||'[]');if(Array.isArray(stored))cart=stored.filter(x=>x&&typeof x.name==='string'&&typeof x.color==='string'&&typeof x.size==='string'&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=99);}catch{}
const shopSelection={};
const money=n=>n.toLocaleString('ko-KR')+'원';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveCart(){try{localStorage.setItem(CART_KEY,JSON.stringify(cart))}catch{}updateBagCount()}
function updateBagCount(){document.querySelectorAll('[data-bag-count]').forEach(e=>e.textContent=cart.reduce((s,x)=>s+x.qty,0))}
function shopNavigate(url){if(typeof window.previewPath==='string'){window.previewPath=url;window.previewQuery='';history.pushState({},'','#'+url)}else history.pushState({},'',url);render();scrollTo(0,0)}
function currentProduct(){const p=(window.previewPath||location.pathname).replace(/\/$/,'');return Object.keys(detailCatalog).find(n=>p==='/collection/'+detailCatalog[n].slug)}
function sizesFor(n){return detailCatalog[n].category==='shoes'?['250','260','270','280']:detailCatalog[n].category==='accessories'?['ONE SIZE']:['M','L','XL']}
function chosenColor(n){return n==='washable knit 7color'?document.querySelector('#selected-knit-color')?.textContent||'Ivory':document.querySelector('#catalog-selected-color')?.textContent||detailCatalog[n].color||n.split(' ')[0].replace(/^./,c=>c.toUpperCase())}
function validateCart(){cart=cart.filter(x=>Object.hasOwn(detailCatalog,x.name)&&sizesFor(x.name).includes(x.size)&&x.color.length<=30);saveCart()}
function bagTotal(){return cart.reduce((s,x)=>s+productInfo[x.name].price*x.qty,0)}
function productURL(n){return '/collection/'+detailCatalog[n].slug+'/'}
function cartImage(n,color){if(n==='washable knit 7color'){const i=Math.max(0,window.rawlandyKnitColors.findIndex(c=>c.name===color));return `<div class="knit-product-image" role="img" aria-label="${esc(color)} washable knit" style="--x:${(i%4)/3*100}%;--y:${i<4?'0%':'100%'};background-image:url('/assets/inline-cec81eee937c9bd3b0.webp')"></div>`}const v=catalogVariants[n],old=activeCatalogColors[n];if(v)activeCatalogColors[n]=Math.max(0,v.colors.findIndex(c=>c.name===color));const result=detailImage(n,0,'cart-thumbnail');if(old===undefined)delete activeCatalogColors[n];else activeCatalogColors[n]=old;return result}
function cartRows(editable){return cart.map((x,i)=>`<article class="bag-row"><a href="${productURL(x.name)}" class="bag-photo">${cartImage(x.name,x.color)}</a><div class="bag-description"><a href="${productURL(x.name)}">${displayProductName(x.name)}</a><p>${esc(x.color)} / ${esc(x.size)}</p><p>${money(productInfo[x.name].price)}</p>${editable?`<div class="bag-row-actions"><div class="qty-control"><button data-qty="${i}" data-delta="-1" aria-label="수량 줄이기" ${x.qty<=1?'disabled':''}>−</button><output>${x.qty}</output><button data-qty="${i}" data-delta="1" aria-label="수량 늘리기" ${x.qty>=99?'disabled':''}>＋</button></div><button class="remove-item" data-remove="${i}">삭제</button></div>`:`<p>수량 ${x.qty}</p>`}</div><strong>${money(productInfo[x.name].price*x.qty)}</strong></article>`).join('')}
function orderSummary(checkout){return `<aside class="order-summary"><h2>주문 요약</h2><dl><div><dt>상품 금액</dt><dd>${money(bagTotal())}</dd></div><div><dt>배송비</dt><dd>0원</dd></div><div class="order-total"><dt>합계</dt><dd>${money(bagTotal())}</dd></div></dl><button class="shop-primary" ${checkout?'data-purchase':'data-checkout'}>${checkout?'구매하기':'주문하기'}</button><a class="shop-continue" href="/collection/">쇼핑 계속하기</a></aside>`}
const shopRoutes={
 '/cart':()=>`<section class="shop-page"><div class="shop-page-head"><span class="eyebrow">YOUR SELECTION</span><h1>Shopping bag <span>(${cart.reduce((s,x)=>s+x.qty,0)})</span></h1></div>${cart.length?`<div class="bag-layout"><div class="bag-items">${cartRows(true)}</div>${orderSummary(false)}</div>`:`<div class="empty-bag"><p>장바구니가 비어 있습니다.</p><a class="shop-primary" href="/collection/">컬렉션 둘러보기</a></div>`}</section>`,
